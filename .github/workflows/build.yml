name: Build and Release

on:
  push:
    tags:
      - 'v*' # Memicu rilis otomatis saat Anda membuat tag versi (contoh: v1.0.0)
  workflow_dispatch: # Memungkinkan Anda memicu build secara manual dari tab Actions

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write # Dibutuhkan untuk membuat Release

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Application
        run: npm run build

      - name: 🚀 Publish Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: nuNox_servis ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
